<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nvEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="nvCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <filter id="nvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#nvGlow)">
    <!-- Left Vertical Stem of 'N' -->
    <rect x="14" y="18" width="15" height="64" rx="3.5" fill="url(#nvEmerald)" />

    <!-- Diagonal Stroke of 'N' -->
    <path
      d="M 27 18.5 C 28.5 17.5 30.8 17.8 32 19.5 L 53 58 L 53 79.5 C 53 81.5 51 83 49 82.5 L 43.5 81 C 42 80.5 40.8 79 40 77.5 L 22 30 C 21 28 21.8 25 24 23.5 Z"
      fill="url(#nvEmerald)"
      opacity="0.95"
    />

    <!-- Forward Vector Chevron '>' -->
    <path
      d="M 51 18.5 C 52.8 17.2 55.2 17.2 57 18.5 L 87.5 46.5 C 89.5 48.2 89.5 51.8 87.5 53.5 L 57 81.5 C 55.2 82.8 52.8 82.8 51 81.5 L 47 77.5 C 45.2 75.8 45.2 73 47 71.2 L 69.5 50 L 47 28.8 C 45.2 27 45.2 24.2 47 22.5 Z"
      fill="url(#nvCyan)"
    />

    <!-- Aperture Signal Coordinate Node -->
    <circle cx="70.5" cy="50" r="4.2" fill="#09090B" stroke="#38BDF8" stroke-width="2.2" />
    <circle cx="70.5" cy="50" r="1.6" fill="#34D399" />
  </g>
</svg>
